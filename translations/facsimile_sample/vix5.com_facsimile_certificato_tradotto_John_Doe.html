<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Protected Viewer</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: rgba(255,255,255,0.06);
      --shadow: 0 18px 55px rgba(0,0,0,0.45);
      --radius: 16px;
      --cols: 8;
      --rows: 10;
    }
    html, body {
      margin: 0; height: 100%;
      background: radial-gradient(1200px 600px at 20% 0%, #172036 0%, transparent 60%),
                  radial-gradient(900px 600px at 80% 20%, #1f1534 0%, transparent 60%),
                  var(--bg);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    * { box-sizing: border-box; }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 22px 18px 40px;
    }

    .page {
      position: relative;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      margin: 18px 0;
      overflow: hidden;
    }

    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1584 / 1224;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(0,0,0,0.25);
      outline: 1px solid rgba(255,255,255,0.10);
    }

    .tiles {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      grid-template-rows: repeat(var(--rows), 1fr);
    }
    .tile {
      background-repeat: no-repeat;
      background-size: cover;
      background-position: 0 0;
      filter: contrast(1.02) saturate(1.01);
    }

    .watermark {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          -25deg,
          rgba(255,255,255,0.00) 0px,
          rgba(255,255,255,0.00) 26px,
          rgba(255,255,255,0.05) 26px,
          rgba(255,255,255,0.05) 28px
        );
      mix-blend-mode: overlay;
      opacity: 0.55;
    }

    .shield {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.001);
      cursor: default;
    }

    @media print {
      body { display: none !important; }
    }

    @media (max-width: 520px) {
      .wrap { padding: 14px 12px 26px; }
    }
  </style>
</head>

    function dataUri(chunks) {
      return "data:image/png;base64," + chunks.join("");
    }

    function renderTiled(frameEl, uri, cols=8, rows=10) {
      const tilesEl = frameEl.querySelector(".tiles");
      tilesEl.style.setProperty("--cols", cols);
      tilesEl.style.setProperty("--rows", rows);

      tilesEl.innerHTML = "";
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const t = document.createElement("div");
          t.className = "tile";
          tilesEl.appendChild(t);
        }
      }

      requestAnimationFrame(() => {
        const rect = frameEl.getBoundingClientRect();
        const W = Math.max(1, Math.round(rect.width));
        const H = Math.max(1, Math.round(rect.height));
        const tileW = W / cols;
        const tileH = H / rows;

        const tiles = Array.from(tilesEl.children);
        tiles.forEach((tile, idx) => {
          const r = Math.floor(idx / cols);
          const c = idx % cols;

          tile.style.backgroundImage = `url("${uri}")`;
          tile.style.backgroundSize = `${W}px ${H}px`;
          tile.style.backgroundPosition = `${-c * tileW}px ${-r * tileH}px`;
        });
      });
    }

    function boot() {
      const p1 = document.querySelector('#page1 .frame');
      const p2 = document.querySelector('#page2 .frame');
      renderTiled(p1, dataUri(PAGE1), 8, 10);
      renderTiled(p2, dataUri(PAGE2), 8, 10);
    }

    // Deterrents (still bypassable via screenshots/devtools)
    document.addEventListener("contextmenu", (e) => e.preventDefault(), { capture: true });
    document.addEventListener("dragstart",  (e) => e.preventDefault(), { capture: true });
    document.addEventListener("selectstart",(e) => e.preventDefault(), { capture: true });

    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      const ctrl = e.ctrlKey || e.metaKey;

      if (ctrl && ["s","p","u","c","a","i","j"].includes(k)) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (e.key === "F12") {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (ctrl && e.shiftKey && ["i","j","c"].includes(k)) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
    }, { capture: true });

    let resizeT;
    window.addEventListener("resize", () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(boot, 120);
    });

    boot();
  </script>
