      function setSection(key) {
        const container = document.getElementById("content-paragraphs");
        container.innerHTML = "";

        const tiles = sectionContent[key] || [];
        const grid = document.createElement("div");
        grid.className = "tiles-grid";

        tiles.forEach((item) => {
          const tile = document.createElement("article");
          tile.className = "tile";

          if (item.title) {
            const h4 = document.createElement("h4");
            h4.className = "tile-title";
            h4.textContent = item.title;
            tile.appendChild(h4);
          }

          const p = document.createElement("p");
          p.className = "tile-body";
          p.innerHTML = item.body || "";
          tile.appendChild(p);

          grid.appendChild(tile);
        });

        container.appendChild(grid);
      }

      function setActiveNav(sectionKey) {
        document
          .querySelectorAll(".nav-link")
          .forEach((l) =>
            l.classList.toggle("active", l.dataset.section === sectionKey)
          );
      }

      function getSectionFromHash() {
        const key = (window.location.hash || "").replace("#", "").trim();
        return sectionContent[key] ? key : null;
      }

      function applySection(sectionKey) {
        setSection(sectionKey);
        setActiveNav(sectionKey);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const navLinks = document.querySelectorAll(".nav-link");

        function applyFromHashOrDefault() {
          const fromHash = getSectionFromHash();
          const fallback =
            document.querySelector(".nav-link.active")?.dataset.section ||
            "whyme";
          applySection(fromHash || fallback);
        }

        navLinks.forEach((link) => {
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const sectionKey = link.dataset.section;

            applySection(sectionKey);

            // Update URL hash so each section is linkable (e.g., /translations/#prices)
            if (window.location.hash !== "#" + sectionKey) {
              window.location.hash = sectionKey;
            } else {
              // If the hash is already the same, still jump to the anchor
              const anchor = document.getElementById(sectionKey);
              if (anchor) anchor.scrollIntoView({ block: "start" });
            }
          });
        });

        window.addEventListener("hashchange", () => {
          const fromHash = getSectionFromHash();
          if (fromHash) applySection(fromHash);
        });

        applyFromHashOrDefault();
      });
