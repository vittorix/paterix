      function setSection(key) {
        const container = document.getElementById("content-paragraphs");
        container.innerHTML = "";

        const tiles = sectionContent[key] || [];
        const grid = document.createElement("div");
        grid.className = "tiles-grid";

        tiles.forEach((item) => {
          const tile = document.createElement("article");
          tile.className = "tile";

          if (item.title) {
            const h4 = document.createElement("h4");
            h4.className = "tile-title";
            h4.textContent = item.title;
            tile.appendChild(h4);
          }

          const p = document.createElement("p");
          p.className = "tile-body";
          // if (item.body) {

          // }
          p.innerHTML = item.body || "";
          tile.appendChild(p);

          grid.appendChild(tile);
        });

        container.appendChild(grid);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const navLinks = document.querySelectorAll(".nav-link");

        navLinks.forEach((link) => {
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const section = link.dataset.section;
            setSection(section);

            document
              .querySelectorAll(".nav-link")
              .forEach((l) => l.classList.remove("active"));
            link.classList.add("active");
          });
        });

        // Load default section based on active nav, fallback to "whyme"
        const defaultSection =
          document.querySelector(".nav-link.active")?.dataset.section ||
          "whyme";
        setSection(defaultSection);
      });
