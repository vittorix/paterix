<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>
      Italian–English Certified Translations | Vittorio Paternostro – 19+ Years
      Experience
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Professional Italian–English Translator and Interpreter. Certified translations with 19+ years of experience. Legal, medical, business and personal documents translation  with a perfect success rate."
    />
    <meta
      property="og:title"
      content="Italian–English Certified Translations | Vittorio Paternostro – 19+ Years Experience"
    />
    <meta
      property="og:description"
      content="Certified translations for legal, medical, business and government documents. 19+ years of experience and 100% success rate."
    />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="translations.css" />
  </head>

  <body>
    <header class="site-header">
      <nav class="navbar">
        <a href="#" class="nav-link active" data-section="whyme">Why me</a>
        <a href="#" class="nav-link" data-section="how">How it works</a>
        <a href="#" class="nav-link" data-section="testimonials"
          >Testimonials</a
        >
        <a href="#" class="nav-link" data-section="prices">Prices</a>
        <a href="#" class="nav-link" data-section="contact">Contact</a>
      </nav>
    </header>

    <main class="hero-overlay">
      <section class="hero-content">
        <h2 class="main-title">Italian ⇌ English</h2>
        <h3>Certified Document Translations</h3>

        <div class="tagline">
          <span>professional quality</span>
          <span>19+ years of experience</span>
          <span>100% success rate</span>
        </div>
        <br />
        <div id="content-paragraphs">
          <!-- Paragraphs will be injected here by JavaScript -->
        </div>

        <p class="cta">
          📧 <a href="mailto:vittorio@example.com">Email me for a quote</a>
        </p>
      </section>
    </main>

    <script>
      const sectionContent = {
        whyme: [
          {
            title: "Experience",
            body: "Over 19 years of experience in making certified translations of confidential documents. Recommended translator for two Italian Consulates and 16 US States.",
          },
          {
            title: "Types of translations",
            body: "Translation of technical, legal, medical, academic transcripts, contracts, and certificates. Translations for individuals, small and large companies like the Air Force and Lockheed Martin.",
          },
          {
            title: "Dedication and quality",
            body: "Fast turnaround, competitive rates, and personalized service. 100% success rate. No translation has ever been rejected by any institution. Save time and money by avoiding resubmissions and corrections.",
          },
          {
            title: "Interpreter",
            body: "Sworn interpreter in US Courts and legal hearings. Interpreter at government events, business negotiations, and trade shows.",
          },
        ],
        how: [
          {
            title: "Send your document",
            body: "You email me a clear scan or photo of your document and tell me where it will be submitted (Consulate, Court, university, employer, etc.).",
          },
          {
            title: "Quote & timing",
            body: "I confirm the price and delivery date. Once you approve, I translate and format the document so that it mirrors the original as closely as possible.",
          },
          {
            title: "Certified delivery",
            body: "You receive a signed and stamped translation in PDF (and, when required, on paper) together with a translator’s declaration that meets institutional requirements.",
          },
        ],
        testimonials: [
          {
            title: "What clients say",
            body: "Non sapevo come funzionassero questo tipo di cose e sono rimasta lo stesso molto soddisfatta dal suo lavoro molto professionale e fatto bene Grazie ancora per tutto G.F.",
          },
        ],
        prices: [
          {
            title: "Standard documents",
            body: "Prices depend on length, topic, and urgency. Short standard documents (IDs, certificates, diplomas) usually have a flat fee.",
          },
          {
            title: "Technical / long texts",
            body: "Longer or highly technical documents (contracts, medical reports, court files) are usually priced per word or per page, with clear estimates before we start.",
          },
          {
            title: "Urgent & bulk work",
            body: "For urgent jobs and large volumes I always propose at least two options, so you can balance speed and cost.",
          },
        ],
        contact: [
          {
            title: "Share your file",
            body: "For a precise quote, please send your document as a PDF or clear photo by email (vittoriopaternostro@gmail.com) and tell me where and when you need to submit it.",
          },
          {
            title: "Fast turnaround",
            body: "Typical response time is within a few business hours. Most standard certificates can be delivered within 1–2 working days.",
          },
          {
            title: "Contact details",
            body: "📧 Email: vittorio@example.com — I look forward to helping you get your documents accepted the first time.",
          },
        ],
      };

      function setSection(key) {
        const container = document.getElementById("content-paragraphs");
        container.innerHTML = "";
        const items = sectionContent[key] || [];

        const grid = document.createElement("div");
        grid.className = "tiles-grid";

        items.forEach((item) => {
          const tile = document.createElement("article");
          tile.className = "tile";

          if (item.title) {
            const h4 = document.createElement("h4");
            h4.className = "tile-title";
            h4.textContent = item.title;
            tile.appendChild(h4);
          }

          const p = document.createElement("p");
          p.className = "tile-body";
          p.textContent = item.body || "";
          tile.appendChild(p);

          grid.appendChild(tile);
        });

        container.appendChild(grid);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const header = document.querySelector(".site-header");

        function updateHeader() {
          if (window.scrollY > 10) {
            header.classList.add("scrolled");
          } else {
            header.classList.remove("scrolled");
          }
        }

        window.addEventListener("scroll", updateHeader);
        updateHeader();

        document.querySelectorAll(".nav-link").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            const section = link.dataset.section;
            setSection(section);

            document
              .querySelectorAll(".nav-link")
              .forEach((l) => l.classList.remove("active"));
            link.classList.add("active");
          });
        });

        // Load default section
        setSection("whyme");
      });
    </script>
  </body>
</html>
