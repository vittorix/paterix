<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>
      Italian–English Certified Translations | Vittorio Paternostro – 19+ Years
      Experience
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Professional Italian–English Translator and Interpreter. Certified translations with 19+ years of experience. Legal, medical, business and personal documents translation  with a perfect success rate."
    />
    <meta
      property="og:title"
      content="Italian–English Certified Translations | Vittorio Paternostro – 19+ Years Experience"
    />
    <meta
      property="og:description"
      content="Certified translations for legal, medical, business and government documents. 19+ years of experience and 100% success rate."
    />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="translations.css" />
  </head>

  <body>
    <header class="site-header">
      <nav class="navbar">
        <a href="#" class="nav-link active" data-section="whyme">Why me</a>
        <a href="#" class="nav-link" data-section="how">How it works</a>
        <a href="#" class="nav-link" data-section="testimonials"
          >Testimonials</a
        >
        <a href="#" class="nav-link" data-section="prices">Prices</a>
        <a href="#" class="nav-link" data-section="contact">Contact</a>
      </nav>
    </header>

    
    <main class="hero-overlay">
      <section class="hero-content">
        <h2 class="main-title">Italian ⇌ English</h2>
        <h3>Certified Document Translations</h3>

        <div class="tagline">
          <span>professional quality</span>
          <span>19+ years of experience</span>
          <span>100% success rate</span>
        </div>
      </section>

      <section class="content-section">
        <div id="content-paragraphs">
          <!-- Tiles will be injected here by JavaScript -->
        </div>

        <p class="cta">
          📧 <a href="mailto:vittorio@example.com">Email me for a quote</a>
        </p>
      </section>
    </main>


    
    <script>
      const sectionContent = {
        whyme: [
          {
            title: "Experience",
            body: "Over 19 years of experience in certified Italian–English translations for individuals, companies, and institutions."
          },
          {
            title: "Types of translations",
            body: "Legal, academic, medical, technical and corporate documents, as well as consular and immigration paperwork."
          },
          {
            title: "Dedication and quality",
            body: "Careful formatting, clear communication, and a focus on getting your documents accepted the first time."
          },
          {
            title: "Interpreter",
            body: "Experienced court and conference interpreter for hearings, depositions, business meetings, and events."
          }
        ],
        how: [
          {
            title: "Send your document",
            body: "Email a clear scan or photo and tell me where it needs to be submitted (Consulate, Court, university, employer, etc.)."
          },
          {
            title: "Quote & timing",
            body: "You receive a clear quote and delivery date. Once approved, I translate and format the document to mirror the original."
          },
          {
            title: "Certified delivery",
            body: "You receive a signed and stamped translation as a PDF (and paper copy if needed) with a translator’s declaration."
          }
        ],
        testimonials: [
          {
            title: "What clients say",
            body: "Clients appreciate the speed, clarity, and reliability of my certified translations, often under tight deadlines."
          }
        ],
        prices: [
          {
            title: "Standard documents",
            body: "Certificates, IDs, and short official documents are usually charged at a flat rate for predictable costs."
          },
          {
            title: "Technical / long texts",
            body: "Contracts, medical reports, and detailed technical documents are usually priced per word or per page."
          },
          {
            title: "Urgent & bulk work",
            body: "For urgent projects and large volumes we can agree on tailored timelines and pricing options."
          }
        ],
        contact: [
          {
            title: "Share your file",
            body: "For a precise quote, email your document and indicate the destination authority and your deadline."
          },
          {
            title: "Fast turnaround",
            body: "Most requests receive an answer within a few business hours, often with more than one delivery option."
          },
          {
            title: "Contact details",
            body: "📧 Email: vittorio@example.com – I look forward to helping you complete your process smoothly."
          }
        ],
      };

      function setSection(key) {
        const container = document.getElementById("content-paragraphs");
        container.innerHTML = "";

        const tiles = sectionContent[key] || [];
        const grid = document.createElement("div");
        grid.className = "tiles-grid";

        tiles.forEach((item) => {
          const tile = document.createElement("article");
          tile.className = "tile";

          if (item.title) {
            const h4 = document.createElement("h4");
            h4.className = "tile-title";
            h4.textContent = item.title;
            tile.appendChild(h4);
          }

          const p = document.createElement("p");
          p.className = "tile-body";
          p.textContent = item.body || "";
          tile.appendChild(p);

          grid.appendChild(tile);
        });

        container.appendChild(grid);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const navLinks = document.querySelectorAll(".nav-link");

        navLinks.forEach((link) => {
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const section = link.dataset.section;
            setSection(section);

            document
              .querySelectorAll(".nav-link")
              .forEach((l) => l.classList.remove("active"));
            link.classList.add("active");
          });
        });

        // Load default section based on active nav, fallback to "whyme"
        const defaultSection =
          document.querySelector(".nav-link.active")?.dataset.section || "whyme";
        setSection(defaultSection);
      });
    </script>

  </body>
</html>
