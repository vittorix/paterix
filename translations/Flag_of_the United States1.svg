<svg xmlns="http://www.w3.org/2000/svg" width="20px" height="13px" viewBox="0 0 20 13" aria-label="US flag (simplified)" role="img">
  <!-- 7 stripes (4 red, 3 white) -->
  <rect width="20" height="13" fill="#fff"></rect>
  <g fill="#B22234">
    <rect x="0" y="0" width="20" height="1.8571"></rect>
    <rect x="0" y="3.7142" width="20" height="1.8571"></rect>
    <rect x="0" y="7.4284" width="20" height="1.8571"></rect>
    <rect x="0" y="11.1426" width="20" height="1.8571"></rect>
  </g>

  <!-- Union (scaled to match simplified flag) -->
  <rect x="0" y="0" width="9" height="7.4284" fill="#3C3B6E"></rect>

  <!-- 20 stars (5x4) as dots for tiny size -->
  <g fill="#fff">
    <!-- grid bounds: x=1..8, y=1..6.4 -->
    <!-- columns (5): 1.2, 2.9, 4.6, 6.3, 8.0 -->
    <!-- rows (4): 1.2, 2.8, 4.4, 6.0 -->
    <circle cx="1.2" cy="1.2" r="0.24"></circle><circle cx="2.9" cy="1.2" r="0.24"></circle><circle cx="4.6" cy="1.2" r="0.24"></circle><circle cx="6.3" cy="1.2" r="0.24"></circle><circle cx="8.0" cy="1.2" r="0.24"></circle>
    <circle cx="1.2" cy="2.8" r="0.24"></circle><circle cx="2.9" cy="2.8" r="0.24"></circle><circle cx="4.6" cy="2.8" r="0.24"></circle><circle cx="6.3" cy="2.8" r="0.24"></circle><circle cx="8.0" cy="2.8" r="0.24"></circle>
    <circle cx="1.2" cy="4.4" r="0.24"></circle><circle cx="2.9" cy="4.4" r="0.24"></circle><circle cx="4.6" cy="4.4" r="0.24"></circle><circle cx="6.3" cy="4.4" r="0.24"></circle><circle cx="8.0" cy="4.4" r="0.24"></circle>
    <circle cx="1.2" cy="6.0" r="0.24"></circle><circle cx="2.9" cy="6.0" r="0.24"></circle><circle cx="4.6" cy="6.0" r="0.24"></circle><circle cx="6.3" cy="6.0" r="0.24"></circle><circle cx="8.0" cy="6.0" r="0.24"></circle>
  </g>
</svg>
