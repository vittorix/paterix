<svg xmlns="http://www.w3.org/2000/svg" width="20px" height="13px" viewBox="0 0 20 13" aria-label="US flag (simplified)" role="img">
  <!-- 7 stripes (4 red, 3 white) -->
  <rect width="20" height="13" fill="#fff"></rect>
  <g fill="#B22234">
    <rect x="0" y="0" width="20" height="1.8571"></rect>
    <rect x="0" y="3.7142" width="20" height="1.8571"></rect>
    <rect x="0" y="7.4284" width="20" height="1.8571"></rect>
    <rect x="0" y="11.1426" width="20" height="1.8571"></rect>
  </g>

  <!-- Union (simplified) -->
  <rect x="0" y="0" width="9" height="7.4284" fill="#3C3B6E"></rect>

  <!-- Star shape (5-point) -->
  <defs>
    <polygon id="star" points="
      0,-0.42
      0.094,-0.130
      0.399,-0.130
      0.153,0.050
      0.247,0.340
      0,0.160
      -0.247,0.340
      -0.153,0.050
      -0.399,-0.130
      -0.094,-0.130
    "></polygon>
  </defs>

  <!-- 12 stars (4x3), 30% bigger -->
  <g fill="#fff">
    <!-- row 1 -->
    <use href="#star" transform="translate(1.4 1.4) scale(1.3)"></use>
    <use href="#star" transform="translate(3.3 1.4) scale(1.3)"></use>
    <use href="#star" transform="translate(5.2 1.4) scale(1.3)"></use>
    <use href="#star" transform="translate(7.1 1.4) scale(1.3)"></use>
    <!-- row 2 -->
    <use href="#star" transform="translate(1.4 3.55) scale(1.3)"></use>
    <use href="#star" transform="translate(3.3 3.55) scale(1.3)"></use>
    <use href="#star" transform="translate(5.2 3.55) scale(1.3)"></use>
    <use href="#star" transform="translate(7.1 3.55) scale(1.3)"></use>
    <!-- row 3 -->
    <use href="#star" transform="translate(1.4 5.7) scale(1.3)"></use>
    <use href="#star" transform="translate(3.3 5.7) scale(1.3)"></use>
    <use href="#star" transform="translate(5.2 5.7) scale(1.3)"></use>
    <use href="#star" transform="translate(7.1 5.7) scale(1.3)"></use>
  </g>
</svg>
