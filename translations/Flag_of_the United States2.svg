<svg xmlns="http://www.w3.org/2000/svg" width="20px" height="13px" viewBox="0 0 20 13" aria-label="US flag (simplified)" role="img">
  <!-- 9 stripes (5 red, 4 white) -->
  <rect width="20" height="13" fill="#fff"></rect>
  <g fill="#B22234">
    <rect x="0" y="0" width="20" height="1.4444"></rect>
    <rect x="0" y="2.8889" width="20" height="1.4444"></rect>
    <rect x="0" y="5.7778" width="20" height="1.4444"></rect>
    <rect x="0" y="8.6667" width="20" height="1.4444"></rect>
    <rect x="0" y="11.5556" width="20" height="1.4444"></rect>
  </g>

  <!-- Union (simplified) -->
  <rect x="0" y="0" width="9" height="6.5" fill="#3C3B6E"></rect>

  <!-- 12 stars (4x3) as dots -->
  <g fill="#fff">
    <!-- columns (4): 1.4, 3.3, 5.2, 7.1 -->
    <!-- rows (3): 1.3, 3.25, 5.2 -->
    <circle cx="1.4" cy="1.3" r="0.26"></circle><circle cx="3.3" cy="1.3" r="0.26"></circle><circle cx="5.2" cy="1.3" r="0.26"></circle><circle cx="7.1" cy="1.3" r="0.26"></circle>
    <circle cx="1.4" cy="3.25" r="0.26"></circle><circle cx="3.3" cy="3.25" r="0.26"></circle><circle cx="5.2" cy="3.25" r="0.26"></circle><circle cx="7.1" cy="3.25" r="0.26"></circle>
    <circle cx="1.4" cy="5.2" r="0.26"></circle><circle cx="3.3" cy="5.2" r="0.26"></circle><circle cx="5.2" cy="5.2" r="0.26"></circle><circle cx="7.1" cy="5.2" r="0.26"></circle>
  </g>
</svg>
